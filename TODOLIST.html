<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Task Manager + Time</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        --accent-color: #6366f1;
        --text-main: #1f2937;
        --card-bg: rgba(255, 255, 255, 0.95);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 60px;
        margin: 0;
        color: var(--text-main);
      }

      .app-card {
        background: var(--card-bg);
        width: 100%;
        max-width: 480px;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
      }

      h1 {
        font-weight: 600;
        font-size: 28px;
        margin: 0 0 24px 0;
        letter-spacing: -0.5px;
      }

      /* Input Section */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 30px;
      }

      input[type="text"],
      input[type="datetime-local"] {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 18px;
        font-size: 15px;
        border: 2px solid transparent;
        background: #f3f4f6;
        border-radius: 12px;
        outline: none;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      input:focus {
        background: #fff;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: -8px;
        margin-left: 4px;
      }

      /* Task List */
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        margin-bottom: 12px;
        background: #fff;
        border-radius: 12px;
        border: 1px solid #f1f3f4;
        animation: slideIn 0.3s ease forwards;
      }

      .task-content {
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        flex-grow: 1;
      }

      .todo-text {
        font-size: 16px;
        font-weight: 500;
      }

      .todo-date {
        font-size: 12px;
        color: #6366f1;
        font-weight: 600;
      }

      .completed .todo-text {
        text-decoration: line-through;
        color: #9ca3af;
      }

      .completed .todo-date {
        color: #d1d5db;
      }

      .delete-btn {
        background: #fee2e2;
        color: #ef4444;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: 15px;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-card">
      <h1>My Schedule</h1>

      <div class="input-group">
        <label>TASK NAME</label>
        <input
          type="text"
          id="todo-input"
          placeholder="What's the plan?"
          autocomplete="off"
        />

        <label>DUE DATE & TIME</label>
        <input type="datetime-local" id="todo-date" />
      </div>

      <ul id="todo-list"></ul>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("todo-input");
        const dateInput = document.getElementById("todo-date");
        const list = document.getElementById("todo-list");

        // Helper to format the date nicely
        const formatDate = (dateStr) => {
          if (!dateStr) return "";
          const options = {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          };
          return (
            "Due: " + new Date(dateStr).toLocaleDateString("en-US", options)
          );
        };

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            const taskValue = input.value.trim();
            const dateValue = dateInput.value;

            if (taskValue !== "") {
              const li = document.createElement("li");

              // Container for text + date
              const content = document.createElement("div");
              content.className = "task-content";

              const spanText = document.createElement("span");
              spanText.className = "todo-text";
              spanText.textContent = taskValue;

              const spanDate = document.createElement("span");
              spanDate.className = "todo-date";
              spanDate.textContent = formatDate(dateValue);

              content.appendChild(spanText);
              if (dateValue) content.appendChild(spanDate);

              // Toggle complete
              content.onclick = () => li.classList.toggle("completed");

              // Delete button
              const btn = document.createElement("button");
              btn.className = "delete-btn";
              btn.innerHTML = "&times;";
              btn.onclick = () => li.remove();

              li.appendChild(content);
              li.appendChild(btn);
              list.appendChild(li);

              // Reset fields
              input.value = "";
              dateInput.value = "";
            }
          }
        });
      });
    </script>
  </body>
</html>
